<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF 8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CHATBOT</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <!-- App Header -->
             <header class="app-header">
             <h1 class="heading">Hello, there</h1>
             <h2 class="sub-heading">How can I help you?</h2>
             </header>

            <div class="chats-container"></div>
             <div class="prompt-container">
                <div class="prompt-wrapper">
                    <form action="#" class="prompt-form">
                        <input type="text" placeholder="Ask anything.." class="prompt-input"
                        required>
                        <div class="prompt-actions">
                            <div class="file-upload-wrapper">
                            <img src="#" class="file-preview">
                            <input type="file" accept="image/*, .pdf, .txt, .csv, .doc" id="file-input" hidden>
                                <button type="button" class="file-icon material-symbols-rounded">description</button>
                                <button id="add-file-btn" type="button" class="material-symbols-rounded">attach_file</button>
                                <button id="cancel-file-btn" type="button" class="material-symbols-rounded">close</button>
                            </div>
                            <button type="button" id="stop-response-btn" class="material-symbols-rounded">stop_circle</button>
                            <button id="send-prompt-btn" class="material-symbols-rounded">send</button>

                        </div>
                    </form>
                    <button id="theme-toggle-btn" class="material-symbols-rounded">light_mode</button>
                    <button id="delete-chats-btn" class="material-symbols-rounded">delete</button>
                </div>
                <p class="disclaimer-text">MyAI can make mistake, so double-check it.</p>
             </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
